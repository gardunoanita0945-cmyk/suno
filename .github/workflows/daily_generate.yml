name: 🎵 Daily Suno Music Generator

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-music:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install dependencies
        run: pip install -r requirements.txt

      - name: 🎼 Run Generator
        env:
          GEMINI_API_KEY:       ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY:   ${{ secrets.OPENROUTER_API_KEY }}
          SUNO_TOKENS:          ${{ secrets.SUNO_TOKENS }}      ← nama baru
        run: python generate.py

      - name: 💾 Commit done.txt
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add done.txt
          git diff --staged --quiet || git commit -m "✅ Update done.txt [skip ci]"
          git push

      - name: 📤 Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: audio-${{ github.run_number }}
          path: output_audio/
          retention-days: 7

      - name: 📋 List output
        run: ls -lh output_audio/ || echo "(kosong)"
